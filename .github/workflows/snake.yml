name: GitHub Snake Game

on:
  # Ejecuta cada día a medianoche UTC
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:
  # También se ejecuta al hacer push a main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Paso 2: Generar las animaciones SVG y GIF
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39d353&color_d0=#ffb3b3&color_d1=#ff9999&color_d2=#ff7f7f&color_d3=#ff6666&color_d4=#ff4c4c
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Paso 3: Publicar los archivos en la rama output
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
