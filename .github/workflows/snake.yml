name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # Cada día a las 00:00 UTC

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake (Light Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: diegoarnanz-maker
          outputs: |
            dist/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake (Dark Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: diegoarnanz-maker
          outputs: |
            dist/github-contribution-grid-snake-dark.svg
          # Opcionalmente puedes personalizar el color con un theme si usas uno que lo soporte
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
