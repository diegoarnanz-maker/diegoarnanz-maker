name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # todos los días a medianoche UTC

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate the snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: diegoarnanz-maker
          outputs: |
            output/github-contribution-grid-snake.svg

      - name: Commit and push to `output` branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan output
          git reset --hard
          cp -f output/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg
          rm -rf output
          git add github-contribution-grid-snake.svg
          git commit -m "update contribution snake 🐍"
          git push -f origin output
